<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030908">
<title>VIP PANEL</title>
<style>
*{box-sizing:border-box}html{height:100%;background:#030908}body{margin:0;min-height:100%;color:#ecfff7;font-family:'Courier New',monospace;background:radial-gradient(ellipse at 50% 32%,#0a51392e,transparent 58%),#030908;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.scene{min-height:100vh;min-height:100svh;position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(26px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px));overflow:hidden}
.scene::before{content:"";position:absolute;z-index:-2;inset:0;background-image:linear-gradient(#60ffb908 1px,transparent 1px),linear-gradient(90deg,#60ffb908 1px,transparent 1px);background-size:34px 34px;pointer-events:none}
.scene::after{content:"";position:absolute;z-index:-1;left:0;right:0;top:-30%;height:30%;background:linear-gradient(transparent,#48ffac06,transparent);border-bottom:1px solid #77ffbb0b;animation:screen-scan 9s linear infinite;pointer-events:none}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:420px;color:#608071;font-size:8px;letter-spacing:.1em;line-height:1.5}.topline strong{font-size:10px;letter-spacing:.15em;font-weight:700;color:#b8d4c7}.topline strong::before{content:"[ / ] ";color:#80ffb2}.edition{display:flex;align-items:center;gap:6px;color:#86ffb8;font-size:8px}.edition i{width:4px;height:4px;background:currentColor;box-shadow:0 0 8px #80ffb2;animation:blink 2s ease-in-out infinite}
.content{width:100%;max-width:370px;text-align:center;padding:24px 0}.emblem{height:240px;width:240px;max-width:100%;margin:0 auto 22px;position:relative;display:grid;place-items:center;background:linear-gradient(#6dffaf, #6dffaf) left 5px top 5px/15px 1px no-repeat,linear-gradient(#6dffaf,#6dffaf) left 5px top 5px/1px 15px no-repeat,linear-gradient(#6dffaf,#6dffaf) right 5px bottom 5px/15px 1px no-repeat,linear-gradient(#6dffaf,#6dffaf) right 5px bottom 5px/1px 15px no-repeat}
.emblem::before{content:"ICON / 01";position:absolute;left:8px;bottom:3px;color:#527d63;font-size:7px;letter-spacing:.12em}.emblem::after{content:"CORE";position:absolute;right:8px;top:2px;color:#527d63;font-size:7px;letter-spacing:.15em}.halo{position:absolute;inset:30px;border-radius:50%;background:radial-gradient(circle,#51ff9e18,transparent 70%);box-shadow:0 0 50px #2bff8512;animation:breathe 4s ease-in-out infinite}
.orbit{position:absolute;inset:14px;border:1px dashed #79d69c4a;border-radius:50%;animation:orbit 36s linear infinite}.orbit::before{content:"";position:absolute;inset:5px;border:2px solid transparent;border-top-color:#97ffb6;border-bottom-color:#42b78988;border-radius:50%;filter:drop-shadow(0 0 4px #3dff9760)}.orbit::after{content:"";position:absolute;width:5px;height:5px;top:27px;right:27px;background:#a5ffb5;box-shadow:0 0 9px #6bff9a}.orbit.inner{inset:37px;border:1px solid #71ce9c20;animation:orbit 12s linear infinite reverse}.orbit.inner::before{inset:3px;border-width:1px;border-top-color:#90ffd0;border-bottom-color:transparent}.orbit.inner::after{display:none}
.logo-stage{width:126px;height:126px;padding:2px;border-radius:24px;position:relative;background:linear-gradient(140deg,#bfffd0,#326448 28%,#132b20 60%,#7befa6);box-shadow:0 10px 0 -6px #081b12,0 18px 35px #000b,0 0 25px #67ffa91a;animation:levitate 4s ease-in-out infinite}.logo-inner{width:100%;height:100%;border-radius:22px;background:#06120c;overflow:hidden;display:grid;place-items:center;position:relative}.logo-inner img{width:100%;height:100%;object-fit:contain;display:block;position:relative;z-index:1}.fallback{position:absolute;color:#a5ffc0;font-size:48px;font-weight:800}.logo-inner::after{content:"";position:absolute;z-index:2;inset:0;border-radius:inherit;box-shadow:inset 0 1px 2px #fff5;pointer-events:none;background:linear-gradient(140deg,#ffffff0c,transparent 40%)}
.spark{position:absolute;inset:50% -5px auto;height:1px;background:linear-gradient(90deg,#6ef0a740,transparent 22%,transparent 78%,#6ef0a740)}.spark.b{inset:-5px auto -5px 50%;width:1px;height:auto;background:linear-gradient(#6ef0a740,transparent 22%,transparent 78%,#6ef0a740)}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#95ffb6;font-size:8px;font-weight:600;letter-spacing:.28em;margin-bottom:11px}.eyebrow::before,.eyebrow::after{content:"";width:18px;height:1px;background:#82f6ac66}
.brand-name{margin:0 auto;max-width:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(27px,8vw,35px);line-height:1.14;font-weight:850;letter-spacing:.04em;overflow-wrap:anywhere;color:#edfff4;text-shadow:0 0 30px #55ffaf24}.tagline{margin:10px 0 25px;font-size:8px;line-height:1.6;color:#628775;letter-spacing:.18em;text-transform:uppercase}
.loading-card{position:relative;padding:0 17px 16px;border:1px solid #7affac2d;border-radius:4px;background:linear-gradient(130deg,#11281c80,#06130de6);box-shadow:0 14px 35px #0004,inset 0 1px 0 #a2ffc30a;text-align:left}.loading-card::before,.loading-card::after{content:"";position:absolute;width:12px;height:12px;border-color:#a3ffc7;border-style:solid;pointer-events:none}.loading-card::before{top:-1px;left:-1px;border-width:1px 0 0 1px}.loading-card::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.terminal-head{height:33px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #83e9ad1a;margin-bottom:13px;font-size:8px;letter-spacing:.13em;color:#92bba1}.terminal-lights{display:flex;gap:4px}.terminal-lights i{width:3px;height:3px;background:#69b388}.terminal-lights i:nth-child(2){opacity:.5}.terminal-lights i:nth-child(3){opacity:.25}
.logs{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px;color:#718f7c;font-size:9px;line-height:1.3}.logs li{display:flex;gap:10px}.logs em{font-style:normal;color:#3c6550;font-size:8px}.logs li:last-child{color:#bceccd}.logs li:last-child span::after{content:"_";color:#a7ffc2;animation:blink 1.4s ease-in-out infinite}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.status{font-size:8px;color:#a1ffc0;letter-spacing:.1em;text-transform:uppercase}.signal{display:flex;align-items:center;gap:3px;height:12px}.signal i{display:block;width:2px;height:5px;background:#a5ffbf;animation:signal 1.4s ease-in-out infinite}.signal i:nth-child(2){height:9px;animation-delay:.16s}.signal i:nth-child(3){height:12px;animation-delay:.32s}.signal i:nth-child(4){height:7px;animation-delay:.48s}
.track{height:4px;background:repeating-linear-gradient(90deg,#679b7730 0 8px,transparent 8px 11px);overflow:hidden}.track span{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#38b678,#b8ffd2);animation:scan 2.6s ease-in-out infinite}.loading-note{font-size:7px;letter-spacing:.07em;color:#587765;margin:10px 0 0;line-height:1.5}.bottom{text-align:center;width:100%;max-width:420px}.bottom-line{width:32px;height:2px;margin:0 auto 12px;background:repeating-linear-gradient(90deg,#6fa586 0 3px,transparent 3px 6px)}.bottom p{font-size:7px;letter-spacing:.18em;color:#52705e;margin:0;line-height:1.6}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes levitate{50%{transform:translateY(-4px)}}@keyframes breathe{50%{opacity:.5}}@keyframes blink{50%{opacity:.35}}@keyframes scan{0%{transform:translateX(-110%)}100%{transform:translateX(350%)}}@keyframes signal{50%{transform:scaleY(.35);opacity:.5}}@keyframes screen-scan{to{transform:translateY(440%)}}
@media(max-height:700px){.scene{padding-top:18px;padding-bottom:16px}.content{padding:16px 0}.emblem{width:184px;height:184px;margin-bottom:15px}.logo-stage{width:104px;height:104px;border-radius:22px}.logo-inner{border-radius:20px}.orbit.inner{inset:29px}.tagline{margin:8px 0 18px}.eyebrow{margin-bottom:8px}.logs{gap:6px;margin-bottom:12px}}
@media(max-height:600px) and (max-width:599px){.scene{padding:16px 20px}.content{padding:12px 0}.emblem{width:152px;height:152px;margin-bottom:12px}.logo-stage{width:88px;height:88px;border-radius:20px}.logo-inner{border-radius:18px}.orbit{inset:8px}.orbit.inner{inset:23px}.brand-name{font-size:27px}.tagline{font-size:7px;margin:7px 0 14px}.loading-card{padding:0 14px 12px}.terminal-head{height:28px;margin-bottom:10px}.logs{font-size:8px;gap:6px}.topline strong{font-size:8px}.edition{font-size:7px}.bottom-line{margin-bottom:8px}}
@media(max-height:460px) and (min-width:600px){.scene{padding:16px 30px}.content{max-width:700px;display:grid;grid-template-columns:200px 1fr;column-gap:24px;align-items:center;text-align:left;padding:15px 0}.emblem{grid-row:1 / 3;margin:0}.branding{align-self:end}.brand-name{font-size:24px}.tagline{margin:6px 0 10px}.eyebrow{margin-bottom:7px}.logs{gap:4px;margin-bottom:9px}.terminal-head{height:26px;margin-bottom:9px}.loading-card{padding-bottom:12px}.bottom{display:none}}

/* Refined HUD layers; decorative only, no extra timer or network dependency. */
.scene{background:radial-gradient(ellipse at 50% 30%,#5bff9d07,transparent 48%)}
.topline{padding-bottom:13px;border-bottom:1px solid #79e9a417;position:relative}.topline::after{content:"";position:absolute;bottom:-1px;left:0;width:28px;height:1px;background:#a4ffc4;box-shadow:0 0 9px #7effa966}
.scanner-dial{position:absolute;inset:0;width:100%;height:100%;color:#84cfa94d;pointer-events:none}.radar-sweep{position:absolute;inset:19px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg 275deg,#7affad03 300deg,#7affad20 357deg,transparent 360deg);animation:orbit 8s linear infinite;pointer-events:none}.satellite{position:absolute;inset:9px;border-radius:50%;animation:orbit 14s linear infinite reverse;pointer-events:none}.satellite i{position:absolute;top:14%;left:14%;width:5px;height:5px;border:1px solid #e8d49c;background:#8f8052;transform:rotate(45deg);box-shadow:0 0 10px #dfc48b66}
.logo-stage{box-shadow:0 1px 0 #bdffd948,0 9px 0 -5px #163322,0 12px 0 -6px #07190e,0 22px 32px #000c,0 0 26px #67ffa923}.logo-inner::after{background:linear-gradient(125deg,#ffffff1c,transparent 35%,transparent 75%,#7cffaa0c)}
.eyebrow{color:#bae9b9}.brand-name{background:linear-gradient(170deg,#ffffff 20%,#d7fbea 60%,#8cac99);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px #a1ffc10c}
.loading-card{background:linear-gradient(120deg,#1438235c,#07140eed 60%);box-shadow:0 18px 32px #0006,inset 0 1px 0 #b4ffce0c}.console-symbol{font-size:11px;letter-spacing:-2px;color:#adffbd;margin-right:5px;font-weight:400}.logs li{position:relative;padding-left:9px;border-left:1px solid #75c38e20;animation:console-pulse 4.8s ease-in-out infinite}.logs li:nth-child(2){animation-delay:1.6s}.logs li:nth-child(3){animation-delay:3.2s}.logs em{color:#769f80}.track{height:5px;position:relative}.track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8px,#08160e 8px 11px);pointer-events:none}.console-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px}.console-footer .loading-note{margin:0}.activity{height:10px;display:flex;align-items:flex-end;gap:2px;flex-shrink:0}.activity i{width:2px;height:4px;background:#78bf91;animation:signal 1.8s ease-in-out infinite}.activity i:nth-child(3n){height:9px;animation-delay:.6s}.activity i:nth-child(3n + 1){height:6px;animation-delay:1.2s}.bottom-line{width:48px;background:repeating-linear-gradient(90deg,#78b38b 0 2px,transparent 2px 6px)}
@keyframes console-pulse{0%,65%,100%{border-left-color:#75c38e20}25%{border-left-color:#a4ffc3;color:#d0ebd8}}
@media(max-height:600px){.topline{padding-bottom:8px}.console-footer{margin-top:9px}.radar-sweep{inset:14px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.track span{width:60%;transform:none}.orbit{transform:rotate(25deg)}.scene::after{display:none}}
</style>
</head>
<body>
<main class="scene" aria-busy="true">
  <header class="topline"><strong>SYSTEM // CORE</strong><span class="edition"><i aria-hidden="true"></i>INITIALIZING</span></header>
  <section class="content" aria-label="Opening your panel">
    <div class="emblem" aria-hidden="true">
      <svg class="scanner-dial" viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="116" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="1 11.15"/><path d="M120 1v9M120 230v9M1 120h9M230 120h9" stroke="#d8d09a" stroke-width="1"/><circle cx="120" cy="120" r="108" fill="none" stroke="currentColor" stroke-width=".5"/></svg><div class="radar-sweep"></div><span class="satellite"><i></i></span><div class="halo"></div><div class="orbit"></div><div class="orbit inner"></div>
      <span class="spark a"></span><span class="spark b"></span>
      <div class="logo-stage"><div class="logo-inner"><span class="fallback">V</span><img src="my_icon.png" alt="" onerror="this.style.display='none'"></div></div>
    </div>
    <div class="branding"><div class="eyebrow">PRIVATE ACCESS</div><div class="brand-name" role="heading" aria-level="1">VIP PANEL</div><p class="tagline">Custom interface · Premium edition</p></div>
    <div class="loading-card"><div class="terminal-head"><span><b class="console-symbol" aria-hidden="true">&gt;_</b> BOOT CONSOLE</span><span class="terminal-lights" aria-hidden="true"><i></i><i></i><i></i></span></div><ul class="logs" aria-hidden="true"><li><em>01</em><span>Preparing interface assets</span></li><li><em>02</em><span>Loading panel workspace</span></li><li><em>03</em><span>Waiting for application</span></li></ul><div class="status-row"><span class="status" role="status">Initializing interface</span><span class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div><div class="track" aria-hidden="true"><span></span></div><div class="console-footer"><p class="loading-note">Please wait while your panel opens.</p><span class="activity" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div></div>
  </section>
  <footer class="bottom"><div class="bottom-line"></div><p>STAND BY // YOUR PANEL IS OPENING</p></footer>
</main>
<!-- Display only: the loading-screen transition is handled by the Android host.
     No extra audio, redirects, network calls, fake connection percentages or completion callbacks.
     Existing build injection replaces .brand-name and my_icon.png for each APK. -->
</body>
</html>
